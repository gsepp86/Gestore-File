[package]
name = "gestore-file"
version = "0.1.0"
edition = "2021"
description = "Gestore file veloce e moderno in Rust"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
dirs = "5"
open = "5"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
