name: Build Rust Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Scarica il codice del repository
      - uses: actions/checkout@v4

      # 2. Configura l'ambiente Rust su Windows (installa rustc e cargo)
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. Compila il progetto in modalità Release (genera il file .exe)
      - name: Build with Cargo
        run: cargo build --release

      # 4. Salva il file .exe come artefatto scaricabile da GitHub
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: Gestore File
          path: target/release/*.exe
